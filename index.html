<!DOCTYPE html>
<html lang="pt-BR">
<!--
  ═══════════════════════════════════════════════════════════════════
  VBM KAIZEN · Dashboard (porta de entrada)
  ═══════════════════════════════════════════════════════════════════
  PAPEL DA PÁGINA
    Tela inicial: hero em tela cheia + navegação para as demais telas.
    Autenticação Microsoft (MSAL) fica aqui — ver bloco no fim do arquivo.

  DEPENDÊNCIAS (carregadas no <head> / fim do <body>)
    • Font Awesome 6  — ícones (fa-solid ...)
    • css/vbm-app.css — Design System VBM: tokens (--vbm-*), reset,
      componentes compartilhados (.btn, .form-control, .modal, .badge...)
    • js/vbm-app.js  — comportamento compartilhado: modais, abas,
      wizard, filtros, toasts, toggles. Auto-inicializa no DOMContentLoaded.
    NÃO usa jQuery, Bootstrap nem AOS — foram removidos por não terem
    uso real (economia de ~446 KB por página).

  ORGANIZAÇÃO DESTE ARQUIVO
    1. <style> local .... overrides desta tela apenas. O que for
                          reutilizável deve ir para vbm-app.css.
    2. <body> .......... topnav → painel de configurações → conteúdo
    3. <script> ........ blocos IIFE independentes, um por recurso

  TEMA CLARO/ESCURO
    Alternado por body[data-bg="dark"] (persistido em localStorage
    'vdt-theme'). Toda regra de cor precisa do par claro + escuro.

  INTERNACIONALIZAÇÃO (i18n)
    Marque o elemento com data-i18n / -title / -aria / -placeholder e
    cadastre a chave nos DOIS dicionários (pt-BR e en) no fim do arquivo.
    Idioma persistido em localStorage 'vdt-lang'.
    Esta página tem dicionário enxuto: só as chaves do topnav e do
    painel de configurações.
  ═══════════════════════════════════════════════════════════════════
-->
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>VBM Kaizen — Dashboard</title>
<link href="css/vendor/e5e202e3c8995079_all.min.css" rel="stylesheet"/>
<link href="css/vbm-app.css?v=20260815-1" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.gstatic.com" rel="preconnect" crossorigin/>
<!-- Poppins carregada SEM bloquear a renderização: como "print" o navegador
     baixa a folha mas não espera por ela para pintar a tela; o onload a
     promove para "all" e a fonte entra assim que chega. Antes, esta linha
     era render-blocking — num ambiente sem saída para a internet a página
     ficava em branco até o timeout do fonts.googleapis.com. O <noscript>
     mantém o comportamento original quando não há JS. -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null;"/>
<noscript><link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet"/></noscript>
<link href="assets/icons/a1922a98664cc516_favicon-32x32-1.png" rel="icon"/>
<style>
/* ═══════════════════════════════════════════════════
   TOPNAV LAYOUT OVERRIDE
   Removes sidebar dependency; uses full-width top bar
═══════════════════════════════════════════════════ */

/* Reset sidebar-based layout */
.app-layout { display: block; min-height: 100vh; }
.app-main   { margin-left: 0; }

/* Hero full-bleed — estoura o padding lateral/superior do .page-content
   (1.75rem) para cobrir 100% da largura e altura da viewport, subindo
   por trás do topnav (sticky, 64px) para que o vidro do menu mostre a
   própria imagem da hero em vez do fundo da página. */
html, body { overflow: hidden; }

.dash-hero {
  width: calc(100% + 3.5rem);
  margin-top: calc(-1.75rem - 64px);
  margin-left: -1.75rem;
  margin-right: 0;
  border-radius: 0;
  height: 100vh;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}
/* Em telas ≤768px o .page-content passa a usar padding de 1rem (regra do
   vbm-app.css). Sem reajustar estes cálculos, a hero ficava 1,5rem mais
   larga que a área útil e deslocada para a direita. */
@media (max-width: 768px) {
  .dash-hero {
    width: calc(100% + 2rem);
    margin-top: calc(-1rem - 64px);
    margin-left: -1rem;
  }
}
/* Em celulares, 100vh ignora a barra do navegador e corta a arte;
   100dvh acompanha a altura realmente visível. */
@supports (height: 100dvh) {
  .dash-hero { height: 100dvh; min-height: 100dvh; }
}

/* Arte completa da hero, já com texto embutido — zoom-in lento e
   contínuo, como se a imagem estivesse se aproximando. */
.dash-hero-bg-img {
  opacity: 1;
  mix-blend-mode: normal;
  object-fit: cover;
  object-position: left bottom;
  animation: heroZoomIn 20s linear infinite alternate;
  will-change: transform;
}
@keyframes heroZoomIn {
  from { transform: scale(1); }
  to   { transform: scale(1.08); }
}

/* ── Top Navigation Bar — replicado 1:1 de Referencias/Value Drive Tree/style.css (.topbar) ── */
.topnav {
  position: sticky;
  top: 0;
  z-index: 100;
  height: 64px;
  background: transparent;
  display: flex;
  align-items: center;
  padding: 0 2rem;
  gap: 0;
  border-bottom: 1px solid rgba(255,255,255,.05);
  box-shadow: none;
  transition: background .3s var(--ease-out), box-shadow .3s var(--ease-out), border-color .3s var(--ease-out);
}
@supports (backdrop-filter: blur(1px)) {
  .topnav { backdrop-filter: blur(4px) saturate(120%); -webkit-backdrop-filter: blur(4px) saturate(120%); }
}
/* Vidro no topo; azul sólido só depois de rolar a página */
.topnav.scrolled {
  background: var(--vbm-blue);
  box-shadow: 0 2px 20px rgba(13,38,64,.18);
}

/* ── Logo ── */
.topnav-logo {
  display: flex;
  align-items: center;
  text-decoration: none;
  flex-shrink: 0;
  margin-right: 1.5rem;
  position: relative; z-index: 1;
}
.topnav-logo img { height: 26px; width: auto; filter: brightness(10); }

/* ── Nav Links ── */
.topnav-links {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .15rem;
  flex: 1;
  position: relative; z-index: 1;
}

.topnav-link {
  display: flex;
  align-items: center;
  gap: .4rem;
  padding: .5rem .85rem;
  border-radius: .45rem;
  font-family:'Poppins', sans-serif;font-weight:400;
  font-size: .72rem;
  letter-spacing: .04em;
  color: rgba(255,255,255,.75);
  text-decoration: none;
  white-space: nowrap;
  transition: color .18s;
  position: relative;
}
.topnav-link i { font-size: .72rem; }
.topnav-link:hover { color: #fff; }
.topnav-link.active {
  color: #fff;
}
.topnav-link::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 50%;
  width: 0;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, #fff 25%, #fff 75%, transparent);
  border-radius: 10px;
  box-shadow: 0 0 8px rgba(255,255,255,.65);
  opacity: 0;
  transform: translateX(-50%);
  transition: width .3s var(--ease-out), opacity .3s var(--ease-out);
}
.topnav-link.active::after {
  width: 60%;
  opacity: 1;
}
.topnav-link:not(.active):hover::after {
  width: 30%;
  opacity: .4;
}

/* Badge on link */
.topnav-badge {
  font-size: .55rem;
  padding: .1rem .35rem;
  border-radius: 10rem;
  background: #c2770e;
  color: #fff;
  font-family:'Poppins', sans-serif;font-weight:700;
  line-height: 1.4;
}

/* ── Section divider in links ── */
.topnav-sep {
  width: 1px;
  height: 20px;
  background: rgba(255,255,255,.25);
  flex-shrink: 0;
  margin: 0 .1rem;
}

/* ── Right actions ── */
.topnav-actions {
  display: flex;
  align-items: center;
  gap: .5rem;
  flex-shrink: 0;
  margin-left: auto;
  position: relative; z-index: 1;
}

/* User chip — tamanhos/cores 1:1 de Referencias/Value Drive Tree/style.css (.user-chip) */
.topnav-user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-left: 10px;
  border-left: 1px solid rgba(255,255,255,.22);
  flex-shrink: 0;
}
.topnav-user-text {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  line-height: 1.3;
}
.topnav-user-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(145deg, var(--vbm-blue-light), var(--vbm-blue-dark));
  border: 1.5px solid rgba(255,255,255,.5);
  display: flex; align-items: center; justify-content: center;
  font-family:'Poppins', sans-serif;font-weight:700;
  font-size: 11px;
  color: #fff;
  flex-shrink: 0;
}
.topnav-user-name {
  font-family:'Poppins', sans-serif;font-weight:600;
  font-size: 11.5px;
  color: #fff;
  white-space: nowrap;
}
.topnav-user-role {
  font-family:'Poppins', sans-serif;font-weight:600;
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: rgba(255,255,255,.6);
  white-space: nowrap;
}

/* ── Mobile hamburger ── */
.topnav-mobile-toggle {
  display: none;
  width: 34px; height: 34px;
  border-radius: .4rem;
  border: none;
  background: rgba(255,255,255,.06);
  color: rgba(255,255,255,.7);
  align-items: center; justify-content: center;
  font-size: .85rem;
  cursor: pointer;
  flex-shrink: 0;
}

/* Mobile drawer */
.topnav-drawer {
  display: none;
  position: fixed;
  top: 64px; left: 0; right: 0;
  background: #020e1c;
  border-bottom: 1px solid rgba(60,181,229,.15);
  z-index: 299;
  padding: .75rem 1rem;
  flex-direction: column;
  gap: .25rem;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.topnav-drawer.open { display: flex; }
.topnav-drawer .topnav-link { font-size: .8rem; padding: .65rem .9rem; }

/* ── Responsive ── */
@media (max-width: 960px) {
  .topnav-links { display: none; }
  .topnav-mobile-toggle { display: flex; }
  .topnav-user-role { display: none; }
}
@media (max-width: 540px) {
  .topnav-user-name { display: none; }
}

/* ═══════════════════════════════════════════════════
   SETTINGS (engrenagem) — replicado 1:1 de
   Referencias/Value Drive Tree/style.css
═══════════════════════════════════════════════════ */

/* ── Botão de engrenagem (abre o painel de configurações) ── */
.settings-btn {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px;
  padding: 0;
  border: none;
  border-radius: 100px;
  background: transparent;
  color: #fff;
  cursor: pointer;
  flex-shrink: 0;
  transition: background .25s, transform .35s var(--ease-spring);
}
.settings-btn:hover { background: rgba(255,255,255,.12); }
.settings-btn[aria-expanded="true"] {
  background: rgba(255,255,255,.18);
  transform: rotate(50deg);
}

/* ════════════════════════════════════════════════════════════
   PAINEL LATERAL DE CONFIGURAÇÕES (Theme + Language)
   ════════════════════════════════════════════════════════════ */
.settings-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity: 0;
  pointer-events: none;
  z-index: 399;
  transition: opacity .3s var(--ease-out);
}
.settings-backdrop.open { opacity: 1; pointer-events: auto; }

.settings-panel {
  position: fixed;
  top: 0; right: 0;
  width: 300px;
  max-width: 90vw;
  height: 100vh;
  background: #fff;
  box-shadow: -16px 0 48px rgba(9,20,34,.22);
  z-index: 400;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform .38s var(--ease-out);
}
.settings-panel.open { transform: translateX(0); }

.settings-panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid #eef1f6;
}
.settings-panel-head h2 {
  font-family:'Poppins', sans-serif;font-weight:700;
  font-size: .92rem;
  letter-spacing: -.01em;
  color: var(--vbm-dark);
}
.settings-close {
  display: flex; align-items: center; justify-content: center;
  width: 24px; height: 24px;
  border: none;
  border-radius: 100px;
  background: #fafcfe;
  color: var(--vbm-mid);
  cursor: pointer;
  transition: background .2s, color .2s;
}
.settings-close svg { width: 11px; height: 11px; }
.settings-close:hover { background: var(--vbm-blue); color: #fff; }

.settings-panel-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.settings-section { display: flex; flex-direction: column; gap: 9px; }
.settings-section-title {
  display: flex; align-items: center; gap: 5px;
  font-family:'Poppins', sans-serif;font-weight:600;
  font-size: 11px;
  color: var(--vbm-dark);
}
.settings-info {
  display: inline-flex; align-items: center; justify-content: center;
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 1px solid #e8e8e8;
  color: var(--vbm-mid);
  font-size: 8px;
  font-style: italic;
  font-family: Georgia, serif;
  cursor: help;
}

.settings-divider {
  height: 1px;
  background: #eef1f6;
  margin: 18px 0;
}

/* Theme — segmentado Claro / Escuro */
.theme-toggle {
  display: flex; align-items: center;
  background: #fafcfe;
  border: 1px solid #e8e8e8;
  border-radius: 100px;
  padding: .16rem; gap: .1rem;
  width: fit-content;
}
.theme-toggle-btn {
  padding: .38rem 1.05rem; border-radius: 100px;
  font-size: .64rem; letter-spacing: .02em;
  color: var(--vbm-mid); border: none; background: transparent;
  cursor: pointer; font-family:'Poppins', sans-serif;font-weight:600;
  transition: background .2s, color .2s; white-space: nowrap; line-height: 1;
}
.theme-toggle-btn.active {
  background: var(--vbm-blue); color: #fff;
  box-shadow: 0 4px 14px rgba(60,181,229,.35);
}

/* Language — select nativo com aparência custom (borda + chevron) */
.settings-select-wrap { position: relative; }
.settings-select {
  width: 100%;
  appearance: none;
  -webkit-appearance: none;
  background: #fff;
  border: 1.5px solid #e8e8e8;
  border-radius: 9px;
  padding: .5rem 1.9rem .5rem .75rem;
  font-family:'Poppins', sans-serif;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--vbm-dark);
  cursor: pointer;
  transition: border-color .2s, box-shadow .2s;
}
.settings-select:hover { border-color: var(--vbm-blue-light); }
.settings-select:focus {
  outline: none;
  border-color: var(--vbm-blue);
  box-shadow: 0 0 0 3px rgba(60,181,229,.15);
}
.settings-select-caret {
  width: 9px; height: 9px;
  position: absolute;
  right: .75rem; top: 50%;
  transform: translateY(-50%);
  color: var(--vbm-mid);
  pointer-events: none;
}

/* Transições suaves ao alternar tema */
.settings-panel, .settings-panel-head, .settings-panel-head h2,
.settings-close, .settings-section-title, .settings-info,
.settings-divider, .theme-toggle, .theme-toggle-btn,
.settings-select, .settings-select-caret, .settings-backdrop {
  transition-property: background, background-color, border-color, color, box-shadow, opacity, transform;
  transition-duration: .25s, .25s, .25s, .25s, .25s, .3s, .38s;
  transition-timing-function: var(--ease-out);
}

/* ── Tema Escuro do painel de Configurações — vidro real, replicando
   1:1 o padrão ".ds-modal"/".ds-input" (vidro) de
   Referencias/VBM - Design System/Design_System_VBM.html ── */
[data-bg="dark"] .settings-panel {
  background: rgba(13,38,64,.92);
  border-left: 1px solid rgba(255,255,255,.12);
  box-shadow: -16px 0 48px rgba(0,0,0,.45);
}
@supports (backdrop-filter: blur(1px)) {
  [data-bg="dark"] .settings-panel {
    background: rgba(255,255,255,.07);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
  }
}
[data-bg="dark"] .settings-panel-head { border-bottom-color: rgba(255,255,255,.1); }
[data-bg="dark"] .settings-panel-head h2 { color: #fff; }
[data-bg="dark"] .settings-close {
  background: rgba(255,255,255,.10);
  color: var(--vbm-blue-light);
}
[data-bg="dark"] .settings-close:hover { background: var(--vbm-blue); color: #fff; }
[data-bg="dark"] .settings-section-title { color: #fff; }
[data-bg="dark"] .settings-info { border-color: rgba(255,255,255,.25); color: rgba(255,255,255,.5); }
[data-bg="dark"] .settings-divider { background: rgba(255,255,255,.1); }
[data-bg="dark"] .theme-toggle { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.09); }
[data-bg="dark"] .theme-toggle-btn { color: rgba(255,255,255,.55); }
[data-bg="dark"] .theme-toggle-btn.active { color: #fff; }

/* Select (form) — "vidro leve" idêntico ao .ds-input dark da referência */
[data-bg="dark"] .settings-select {
  background: rgba(255,255,255,.06);
  border-color: rgba(255,255,255,.14);
  color: var(--vbm-white);
}
@supports (backdrop-filter: blur(1px)) {
  [data-bg="dark"] .settings-select { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
}
[data-bg="dark"] .settings-select:focus {
  border-color: var(--vbm-blue);
  box-shadow: 0 0 0 3px rgba(60,181,229,.18);
  background: rgba(255,255,255,.09);
}
[data-bg="dark"] .settings-select option { background: var(--vbm-blue-deep); color: #fff; }
[data-bg="dark"] .settings-select-caret { color: rgba(255,255,255,.5); }

/* ════════════════════════════════════════════════════════════
   TEMA ESCURO — aplicado à página inteira (replica o alcance do
   body[data-bg="dark"] da referência, que reskina TODOS os
   componentes visíveis, não só o painel de configurações)
   ════════════════════════════════════════════════════════════ */
body,
.topnav, .topnav-link, .settings-btn {
  transition: background .3s var(--ease-out), background-color .3s var(--ease-out),
              border-color .3s var(--ease-out), color .3s var(--ease-out),
              box-shadow .3s var(--ease-out);
}

body[data-bg="dark"] {
  /* Redefine os tokens de texto do Design System — cascade automático
     para TODO texto que usa var(--vbm-dark)/var(--vbm-mid), inclusive
     nos estilos inline dos cards/tabela/hero (nenhum deles usa esses
     tokens como background nesta página, então é seguro sobrescrever). */
  --vbm-dark: #f4f7fb;
  --vbm-mid: rgba(244,247,251,.55);
  --vbm-text: rgba(244,247,251,.82);
  background:
    radial-gradient(ellipse 80% 50% at 72% 6%, rgba(60,181,229,.10) 0%, transparent 55%),
    linear-gradient(160deg, #10131a 0%, var(--vbm-blue-deep) 100%);
  background-attachment: fixed;
}

/* Topbar — vidro no topo (translúcido) e opaco só depois do scroll,
   igual ao tema claro, só que com tinte escuro em vez de azul */
[data-bg="dark"] .topnav {
  background: transparent;
  border-bottom-color: rgba(255,255,255,.05);
}
[data-bg="dark"] .topnav.scrolled {
  background: rgba(13,38,64,.92);
  box-shadow: 0 2px 24px rgba(0,0,0,.4);
}
[data-bg="dark"] .topnav-link { color: rgba(255,255,255,.65); }
[data-bg="dark"] .topnav-link:hover { color: #fff; }
[data-bg="dark"] .topnav-sep { background: rgba(255,255,255,.14); }
[data-bg="dark"] .topnav-user { border-left-color: rgba(255,255,255,.16); }

/* Scrollbar discreto (webkit) para um acabamento mais premium */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,.14); border-radius: 100px; border: 2px solid transparent; background-clip: content-box; }
[data-bg="dark"] ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); background-clip: content-box; }
</style>
</head>
<body>

<!-- Dados do usuário logado (Microsoft Graph) — reaproveita o token do
     login já existente; sem MSAL próprio, sem alterar o fluxo de auth. -->
<script src="js/usuario-graph.js?v=20260816-1"></script>
<script>
// ─── Login com conta Microsoft (MSAL.js / Azure AD - Entra ID) ───
// PENDENTE DE CONFIGURAÇÃO: preencha clientId e authority abaixo com os
// dados do app registrado no Azure Portal (Azure AD/Entra ID > App
// registrations > New registration):
//   • clientId  = "Application (client) ID" do app registrado
//   • authority = "https://login.microsoftonline.com/<TENANT_ID>"
//                 (Tenant ID = "Directory (tenant) ID", ou use
//                 "organizations" para aceitar qualquer tenant do Azure AD)
//   • Em "Authentication" no Azure Portal, adicione esta URL exata como
//     Redirect URI do tipo SPA: a própria URL desta página (ex.:
//     http://localhost/index.html ou o domínio final de produção).
//   • Em "API permissions", garanta o escopo "User.Read" (Microsoft Graph).
// Enquanto os campos abaixo estiverem com os placeholders, este bloco não
// tenta nenhum login — nada quebra. O cabeçalho ainda mostra a pessoa
// real: js/usuario-graph.js usa a identidade que o proxy do Databricks
// Apps já repassa (ver GET /api/me em server.js), sem depender do MSAL.
(function () {
  var MSAL_CONFIG = {
    clientId: 'SEU_CLIENT_ID_AQUI',
    authority: 'https://login.microsoftonline.com/SEU_TENANT_ID_AQUI',
    redirectUri: window.location.href
  };
  var LOGIN_SCOPES = ['User.Read'];

  var isConfigured = MSAL_CONFIG.clientId !== 'SEU_CLIENT_ID_AQUI'
    && MSAL_CONFIG.authority.indexOf('SEU_TENANT_ID_AQUI') === -1;
  if (!isConfigured) return;

  // A msal-browser.min.js (~200 KB, CDN externo) só é baixada a partir
  // daqui — ou seja, apenas quando o login está de fato configurado.
  // Antes ela vinha num <script src> fixo no HTML e era baixada em todo
  // carregamento do dashboard, mesmo com os placeholders acima fazendo
  // este bloco sair na linha anterior sem usá-la para nada.
  var MSAL_CDN = 'https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js';

  function carregarMsal() {
    return new Promise(function (resolve, reject) {
      if (typeof msal !== 'undefined') return resolve();
      var s = document.createElement('script');
      s.src = MSAL_CDN;
      s.async = true;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('Falha ao carregar ' + MSAL_CDN)); };
      document.head.appendChild(s);
    });
  }

  var nameEl   = document.getElementById('topnavUserName');
  var avatarEl = document.getElementById('topnavUserAvatar');

  function initials(name) {
    var parts = name.trim().split(/\s+/);
    var first = parts[0] ? parts[0][0] : '';
    var last  = parts.length > 1 ? parts[parts.length - 1][0] : '';
    return (first + last).toUpperCase();
  }

  // Render imediato, só com o que o token já traz (nome + iniciais).
  // A segunda linha (matrícula) NÃO é tocada aqui: ela vem do MDM via
  // js/usuario-graph.js, que já roda antes deste bloco (piso Databricks)
  // e é reforçada quando o Graph responder.
  function renderAccount(account) {
    if (!account) return;
    var name = account.name || account.username;
    if (nameEl) nameEl.textContent = name;
    if (avatarEl) avatarEl.textContent = initials(name);
  }

  // Perfil completo (nome, empresa, foto, cargo, gestor, etc.) fica a
  // cargo do js/usuario-graph.js, que reaproveita ESTE token — mesmo
  // escopo delegado User.Read, sem login novo. Só entregamos aqui a
  // função que devolve o access token; a busca no Graph, o cache da
  // sessão e a renderização no cabeçalho ficam lá, compartilhados com
  // as demais telas.
  function carregarPerfilGraph(msalInstance, account) {
    if (!window.VBMUsuario) return Promise.resolve(null);
    return VBMUsuario.carregarDoGraph(async function () {
      var tokenResp = await msalInstance.acquireTokenSilent({ scopes: LOGIN_SCOPES, account: account });
      return tokenResp.accessToken;
    });
  }

  (async function () {
    try {
      await carregarMsal();
    } catch (e) {
      // CDN indisponível: mantém o usuário mockado, como já acontecia
      // quando o <script src> externo falhava.
      console.warn('Login Microsoft indisponível, mantendo usuário padrão.', e);
      return;
    }

    var msalInstance = new msal.PublicClientApplication({
      auth: {
        clientId: MSAL_CONFIG.clientId,
        authority: MSAL_CONFIG.authority,
        redirectUri: MSAL_CONFIG.redirectUri
      },
      cache: { cacheLocation: 'sessionStorage' }
    });
    await msalInstance.initialize();

    try {
      var redirectResult = await msalInstance.handleRedirectPromise();
      var account = (redirectResult && redirectResult.account) || msalInstance.getAllAccounts()[0];

      if (!account) {
        // Sem sessão ativa: tenta login silencioso (SSO) e, se falhar,
        // redireciona para o login da Microsoft.
        try {
          var silent = await msalInstance.ssoSilent({ scopes: LOGIN_SCOPES });
          account = silent.account;
        } catch (silentErr) {
          msalInstance.loginRedirect({ scopes: LOGIN_SCOPES });
          return;
        }
      }

      msalInstance.setActiveAccount(account);
      // Nome/iniciais na hora, direto do token — a foto e a empresa
      // chegam logo depois, quando o Graph responder.
      renderAccount(account);
      await carregarPerfilGraph(msalInstance, account);
    } catch (e) {
      // Falha de autenticação: mantém o usuário mockado como fallback.
      console.warn('Login Microsoft indisponível, mantendo usuário padrão.', e);
    }
  })();
})();

(function(){
  // Mobile toggle for topnav drawer
  var btn    = document.getElementById('mobileToggle');

  if(btn && drawer){
    btn.addEventListener('click', function(){
      var open = drawer.classList.toggle('open');
      btn.querySelector('i').className = open ? 'fa-solid fa-xmark' : 'fa-solid fa-bars';
    });

        btn.querySelector('i').className = 'fa-solid fa-bars';

    });

})();

// ─── Painel de Configurações (engrenagem) — replicado de Value Driver Tree ───
(function () {
  var btn = document.getElementById('settingsBtn');
  var panel = document.getElementById('settingsPanel');
  var backdrop = document.getElementById('settingsBackdrop');
  var closeBtn = document.getElementById('settingsClose');
  if (!btn || !panel || !backdrop) return;

  function openPanel() {
    panel.classList.add('open');
    backdrop.classList.add('open');
    btn.setAttribute('aria-expanded', 'true');
    panel.setAttribute('aria-hidden', 'false');
  }
  function closePanel() {
    panel.classList.remove('open');
    backdrop.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
    panel.setAttribute('aria-hidden', 'true');
  }

  btn.addEventListener('click', function () {
    panel.classList.contains('open') ? closePanel() : openPanel();
  });
  closeBtn && closeBtn.addEventListener('click', closePanel);
  backdrop.addEventListener('click', closePanel);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closePanel();
  });
})();

// ─── Tema (Claro/Escuro) do painel de Configurações ───
(function () {
  var THEME_KEY = 'vdt-theme';
  var btnWhite = document.getElementById('btnWhite');
  var btnBusiness = document.getElementById('btnBusiness');
  if (!btnWhite && !btnBusiness) return;

  function applyTheme(theme) {
    var isDark = theme === 'dark';
    document.body.dataset.bg = isDark ? 'dark' : '';
    if (btnWhite) btnWhite.classList.toggle('active', !isDark);
    if (btnBusiness) btnBusiness.classList.toggle('active', isDark);
  }

  var saved = 'light';
  try { saved = localStorage.getItem(THEME_KEY) === 'dark' ? 'dark' : 'light'; } catch (e) {}
  applyTheme(saved);

  btnWhite && btnWhite.addEventListener('click', function () {
    applyTheme('light');
    try { localStorage.setItem(THEME_KEY, 'light'); } catch (e) {}
  });
  btnBusiness && btnBusiness.addEventListener('click', function () {
    applyTheme('dark');
    try { localStorage.setItem(THEME_KEY, 'dark'); } catch (e) {}
  });
})();

// ─── Idioma (PT-BR/EN) do painel de Configurações ───
(function () {
  /* Dicionário de tradução — contém APENAS as chaves presentes no DOM
     desta página (topnav + painel de configurações). Ao adicionar um
     data-i18n no HTML, inclua a chave correspondente nos dois idiomas. */
  var I18N = {
    'pt-BR': {
      'settings.btnTitle':   'Configurações',
      'settings.title':      'Configurações',
      'settings.close':      'Fechar',
      'settings.theme':      'Tema',
      'settings.language':   'Idioma',
      'settings.languageInfo': 'Idioma da interface',
      'theme.white':         'Claro',
      'theme.dark':          'Escuro',
      'nav.novoKaizen':      'Novo Kaizen',
      'nav.biblioteca':      'Biblioteca',
      'nav.aprovacao':       'Aprovação',
      'nav.administracao':   'Administração',
      'role.operador':       'Operador'
    },
    'en': {
      'settings.btnTitle':   'Settings',
      'settings.title':      'Settings',
      'settings.close':      'Close',
      'settings.theme':      'Theme',
      'settings.language':   'Language',
      'settings.languageInfo': 'Interface language',
      'theme.white':         'Light',
      'theme.dark':          'Dark',
      'nav.novoKaizen':      'New Kaizen',
      'nav.biblioteca':      'Library',
      'nav.aprovacao':       'Approval',
      'nav.administracao':   'Administration',
      'role.operador':       'Operator'
    }
  };

  var select = document.getElementById('langSelect');
  if (!select) return;

  /* Cada atributo data-i18n-* mapeia para uma propriedade/atributo do
     elemento. Tabela em vez de blocos repetidos: para suportar um novo
     alvo de tradução, basta acrescentar uma linha aqui. */
  var TARGETS = [
    ['data-i18n',             'textContent'],
    ['data-i18n-title',       'title'],
    ['data-i18n-aria',        'aria-label'],
    ['data-i18n-placeholder', 'placeholder']
  ];

  function translate(lang) {
    var dict = I18N[lang] || I18N['pt-BR'];
    TARGETS.forEach(function (target) {
      var attr = target[0], prop = target[1];
      document.querySelectorAll('[' + attr + ']').forEach(function (el) {
        var value = dict[el.getAttribute(attr)];
        if (value == null) return;
        if (prop === 'textContent') el.textContent = value;
        else el.setAttribute(prop, value);
      });
    });
  }

  function applyLang(lang) {
    if (!I18N[lang]) lang = 'pt-BR';
    select.value = lang;
    translate(lang);
    try { localStorage.setItem('vdt-lang', lang); } catch (e) {}
    // Avisa quem mostra dados do banco (listas bilíngues) para
    // reconsultar no novo idioma — ver window.VBMIdioma em vbm-app.js.
    try { window.dispatchEvent(new Event('vbm:idioma')); } catch (e) {}
  }

  select.addEventListener('change', function () { applyLang(select.value); });

  var savedLang = 'pt-BR';
  try { savedLang = localStorage.getItem('vdt-lang') || 'pt-BR'; } catch (e) {}
  applyLang(savedLang);
})();
</script>
