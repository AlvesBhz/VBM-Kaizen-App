        ${def.multiple ? `<div class="qf-panel-actions">
          <button type="button" class="qf-action-link" data-action="select-all">Selecionar Todos</button>
          <button type="button" class="qf-action-link" data-action="clear-selection">Limpar Seleção</button>
        </div>` : ''}
        <div class="qf-options" id="qfOptions-${def.key}"></div>
      </div>
    </div>
  `).join('') + `
      <button type="button" class="qf-clear-btn" id="qfClearBtn" aria-label="Limpar todos os filtros">
        <i class="fa-solid fa-arrow-rotate-left" aria-hidden="true"></i> Limpar Filtros
      </button>
    </div>
    <span class="qf-loader" id="qfLoader" aria-hidden="true"></span>
  `;

  FILTER_DEFS.forEach(def => {
    renderFilterOptions(def);
    const field = bar.querySelector(`[data-field="${def.key}"]`);
    const trigger = field.querySelector('.qf-trigger');
    const openPanel = () => { closeAllPanels(); field.classList.add('open'); trigger.setAttribute('aria-expanded', 'true'); };
    trigger.addEventListener('click', (e) => {
      e.stopPropagation(); // senão o listener de document fecharia o painel no mesmo clique
      field.classList.contains('open') ? closeAllPanels() : openPanel();
    });
    // Esc fecha o painel e devolve o foco ao trigger — teclado não perde o lugar
    field.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && field.classList.contains('open')) {
        closeAllPanels();
        trigger.focus();
      }
    });
    const searchInput = field.querySelector('.qf-search input');
    if (searchInput) {
      searchInput.addEventListener('input', () => renderFilterOptions(def, searchInput.value));
      searchInput.addEventListener('click', (e) => e.stopPropagation());
    }
    field.querySelector('.qf-panel').addEventListener('click', (e) => e.stopPropagation());

    field.querySelectorAll('.qf-action-link').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const set = filterState[def.key];
        if (btn.getAttribute('data-action') === 'select-all') {
          set.clear();
          (filterOptions[def.key] || []).forEach(o => set.add(o.value));
        } else {
          set.clear();
        }
        onFilterChanged(def.key);
      });
    });
  });

  document.addEventListener('click', closeAllPanels);

  // Limpar Filtros: zera o estado de TODOS os filtros (sem reaplicar padrões)
  // e as buscas internas; refresh reconsulta o dataset completo e volta à pág. 1
  document.getElementById('qfClearBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    FILTER_DEFS.forEach(d => { filterState[d.key] = d.multiple ? new Set() : null; });
    filterState.product = getDefaultProduct();
    bar.querySelectorAll('.qf-search input').forEach(i => { i.value = ''; });
    closeAllPanels();
    refreshFiltersAndChart();
  });
}

// closeAllPanels também repõe aria-expanded="false" nos triggers que
// estavam abertos (senão um leitor de tela reportaria o menu como aberto
// mesmo depois de fechado por Esc/clique fora)
function closeAllPanels() {
  document.querySelectorAll('.qf-field.open').forEach(f => {
    f.classList.remove('open');
    f.querySelector('.qf-trigger')?.setAttribute('aria-expanded', 'false');
  });
}

// ── Filtro padrão ao abrir a página: trimestre atual + semestre atual +
//    ano atual (Horizonte), restritos a Budget e Act/Fcst (Visão), e o
//    site Copper Business — pedido explícito do usuário. Roda uma única
//    vez, sobre `allRows` já carregado, antes do primeiro
//    refreshFiltersAndChart(); depois disso o usuário controla os
//    filtros normalmente (Limpar Filtros continua limpando tudo).
//    "Atual" usa a data real do navegador — não há como o front-end
//    replicar @DT_REF (vem de IBP.CONTROLE_PROCESSOS, só existe no banco).
//    Se o dataset não tiver linhas do período/site esperado (fixture local
//    fora da janela, ambiente sem aquele site, etc.), a seleção correspondente
//    fica vazia e o filtro simplesmente não restringe nada — sem erro.
// Período "atual" de UMA granularidade (QUARTER/SEMESTER/YEAR), derivado
// do próprio corte Actual/Forecast que a QUARTELY.sql já calculou a
// partir de @DT_REF (sufixo 'A' = fechado, 'F' = em aberto) — NUNCA do
// relógio do navegador. O primeiro período em aberto ('F') É o atual;
// sem nenhum 'F' presente (nada aberto ainda para essa granularidade),
// cai no último 'A' (o mais recente já fechado). Isso evita que o
// default fique "à frente" dos dados reais quando um KPI específico
// ainda não tem carga para o trimestre corrente do calendário — cada
// KPI pode fechar em datas diferentes, então isso é varrido sobre TODAS
// as linhas da granularidade, não só as de um Product/Site já filtrado.
function detectCurrentPeriod(rows, cdVisao) {
  const candidates = [];
  rows.forEach(r => {
    if (r.CD_VISAO !== cdVisao) return;
    const lastChar = splitTypeLabel(r.Type.trim()).core.slice(-1).toUpperCase();
    if (lastChar !== 'A' && lastChar !== 'F') return;
    candidates.push({ ORDEM_ANO: r.ORDEM_ANO, ORDEM_PERIODO: r.ORDEM_PERIODO, open: lastChar === 'F' });
  });
  const open = candidates.filter(c => c.open);
  const pool = open.length ? open : candidates.filter(c => !c.open);
  if (!pool.length) return null;
  const cmp = open.length
    ? (a, b) => (a.ORDEM_ANO - b.ORDEM_ANO) || (a.ORDEM_PERIODO - b.ORDEM_PERIODO) // 1º em aberto
    : (a, b) => (b.ORDEM_ANO - a.ORDEM_ANO) || (b.ORDEM_PERIODO - a.ORDEM_PERIODO); // último fechado
  return [...pool].sort(cmp)[0];
}

// Product é seleção única obrigatória: padrão = 1º NM_KPI em ordem alfabética
// entre os disponíveis para os demais filtros ativos (evita gráfico vazio)
function getDefaultProduct() {
  const available = extractOptions('product', allRows.filter(r => rowMatchesFilters(r, 'product')));
  return (available[0] || extractOptions('product', allRows)[0])?.value ?? null;
}

function applyDefaultFilters(rows) {
  const defaultSeries = new Set(['Budget', 'Act/Fcst']);
  const quarter = detectCurrentPeriod(rows, 'QUARTER');
  const semester = detectCurrentPeriod(rows, 'SEMESTER');
  const year = detectCurrentPeriod(rows, 'YEAR');

  const horizonTypes = new Set();
  rows.forEach(r => {
    if (!defaultSeries.has(r.NM_TYPE)) return;
    if (quarter && r.CD_VISAO === 'QUARTER' && r.ORDEM_ANO === quarter.ORDEM_ANO && r.ORDEM_PERIODO === quarter.ORDEM_PERIODO) horizonTypes.add(r.Type);
    else if (semester && r.CD_VISAO === 'SEMESTER' && r.ORDEM_ANO === semester.ORDEM_ANO && r.ORDEM_PERIODO === semester.ORDEM_PERIODO) horizonTypes.add(r.Type);
    else if (year && r.CD_VISAO === 'YEAR' && r.ORDEM_ANO === year.ORDEM_ANO) horizonTypes.add(r.Type);
  });
  if (horizonTypes.size) {
    filterState.visoes = new Set(defaultSeries);
    filterState.horizontes = horizonTypes;
  }

  const defaultSite = rows.find(r => r.NM_SITE && r.NM_SITE.toLowerCase().includes('copper business'));
  if (defaultSite) filterState.sites = new Set([String(defaultSite.ID_SITE)]);
}

async function initQuartelyPage() {
  setFiltersInitialLoading(true);

  applyChartBackgroundColor(); // aplica cor de fundo ao wrapper
  allRows = await loadQuartelyData();
  applyDefaultFilters(allRows);
  filterState.product = getDefaultProduct();
  buildFiltersBar();     // cria o DOM primeiro — initCharts já popula tudo
  wireChartColorClicks();
  initCharts();
  setFiltersInitialLoading(false);
}

// Estado de carga inicial (dataset ainda não chegou) — distinto de
// setFiltersBusy (recálculo local após um clique, quase instantâneo): aqui

// ════════════════════════════════════════════════════════════════════
// MÚLTIPLOS GRÁFICOS — cada card guarda filtros, produto, cores, página,
// posição e tamanho próprios. O card selecionado é o "ativo": só ele recebe
// os ids (#chartArea, #chartTitle...) e o estado global (filterState, COLORS,
// chartPage) que o restante do código já usa. Persistido no localStorage
// ('vdt-charts'), no mesmo padrão de 'vdt-theme'/'vdt-lang'.
// ════════════════════════════════════════════════════════════════════
const CHARTS_KEY = 'vdt-charts';
const CHART_IDS = {
  '.chart-area': 'chartArea', '.chart-title': 'chartTitle', '.chart-subtitle': 'chartSubtitle',
  '.chart-pager': 'chartPager', '.chart-resize-handle': 'chartResizeHandle', '.color-reset-icon': 'colorResetIcon'
};
const BOARD_M = 8, CHART_MIN_H = 260;
const board = document.querySelector('.page-content');
// A paleta é única e global: fica fora dos cards (senão clicar nela selecionaria o card que a contém)
document.body.appendChild(document.getElementById('chartPalette'));
const chartTemplate = (() => {
  const t = document.getElementById('chartWrapper').cloneNode(true);
  t.removeAttribute('id');
  t.removeAttribute('style');
  t.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
  return t;
})();
let charts = [];
let activeChart = null;
let defaultFilters = null;

const serializeFilters = () => Object.fromEntries(FILTER_DEFS.map(d => [d.key, d.multiple ? [...filterState[d.key]] : filterState[d.key]]));
function loadFilters(obj) {
  FILTER_DEFS.forEach(d => {
    const v = obj ? obj[d.key] : undefined;
    filterState[d.key] = d.multiple ? new Set(Array.isArray(v) ? v : []) : (v ?? null);
  });
  if (!allRows.some(r => r.NM_KPI === filterState.product)) filterState.product = getDefaultProduct();
}

function stashActive() {
  if (!activeChart) return;
  activeChart.filters = serializeFilters();
  activeChart.colors = { ...COLORS };
  activeChart.page = chartPage;
}

function setChartIds(c, on) {
  c.el.id = on ? 'chartWrapper' : '';
  if (!on) c.el.removeAttribute('id');
  Object.entries(CHART_IDS).forEach(([sel, id]) => {
    const n = c.el.querySelector(sel);
    if (on) n.id = id; else n.removeAttribute('id');
  });
}

function activateChart(c) {
  if (!c || activeChart === c) return;
  closeChartPalette();
  closeAllPanels();
  stashActive();
  if (activeChart) { setChartIds(activeChart, false); activeChart.el.classList.remove('is-selected'); }
  activeChart = c;
  setChartIds(c, true);
  c.el.classList.add('is-selected');
  loadFilters(c.filters);
  Object.keys(COLORS).forEach(k => delete COLORS[k]);
  Object.assign(COLORS, { bgChart: '#F6F6F6' }, c.colors);
  chartPage = c.page || 0;
  document.querySelectorAll('.qf-search input').forEach(i => { i.value = ''; });
  Object.keys(renderedFilterSig).forEach(k => delete renderedFilterSig[k]);
  refreshFilterBar();
  updateChartActionButtons();
}

function renderActiveChart() {
  updateChartTitle();
  updateChartUnit();
  applyChartBackgroundColor();
  renderTurnoverChart(getFilteredChartRows());
}

function deselectChart() {
  if (!activeChart) return;
  closeChartPalette();
  stashActive();
  setChartIds(activeChart, false);
  activeChart.el.classList.remove('is-selected');
  activeChart = null;
  updateChartActionButtons();
}

function renderAllCharts() {
  const current = activeChart;
  charts.forEach(c => { activateChart(c); renderActiveChart(); });
  if (current) activateChart(current); else deselectChart();
}

function saveCharts() {
  if (!board.classList.contains('charts-board')) return;
  stashActive();
  try {
    localStorage.setItem(CHARTS_KEY, JSON.stringify({
      active: activeChart && activeChart.id,
      charts: charts.map(c => ({ id: c.id, filters: c.filters, colors: c.colors, page: c.page, size: c.size, pos: c.pos }))
    }));
  } catch (e) { /* localStorage indisponível — sessão segue sem persistir */ }
}

// Nome e estado de seleção anunciados por leitor de tela
function labelCharts() {
  charts.forEach((c, i) => {
    const on = c === activeChart;
    const prod = on ? filterState.product : c.filters && c.filters.product;
    c.el.setAttribute('aria-label', `Gráfico ${i + 1}${prod ? ': ' + prod : ''}${on ? ', selecionado' : ''}`);
    if (on) c.el.setAttribute('aria-current', 'true'); else c.el.removeAttribute('aria-current');
  });
}

function announce(msg) {
  const live = document.getElementById('chartLive');
  live.textContent = '';
  setTimeout(() => { live.textContent = msg; }, 30);
}

// ── Copiar/colar gráfico (Ctrl/⌘+C, Ctrl/⌘+V) — ignorado em campos editáveis ──
let chartClipboard = null;
function pasteChart() {
  if (!chartClipboard) return;
  stashActive();
  const size = clampSize(chartClipboard.size.w, chartClipboard.size.h);
  const bottom = Math.max(0, ...charts.map(c => c.pos.y + c.el.offsetHeight));
  const x = activeChart ? activeChart.pos.x : (board.clientWidth - size.w) / 2;
  const c = mountChart({ ...JSON.parse(JSON.stringify(chartClipboard)), size, pos: { x, y: bottom + 24 } });
  updateBoardHeight();
  activateChart(c);
  renderActiveChart();
  saveCharts();
  c.el.focus({ preventScroll: true });
  c.el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  announce('Gráfico colado como ' + c.el.getAttribute('aria-label').replace(', selecionado', ''));
}
function onChartShortcut(e) {
  if (!(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey) return;
  const t = e.target;
  if (t.closest('input, textarea, select, [contenteditable=""], [contenteditable="true"]') || document.querySelector('.qf-modal-overlay.open')) return;
  const k = e.key.toLowerCase();
  if (k === 'c' && activeChart && !String(window.getSelection() || '')) {
    stashActive();
    chartClipboard = JSON.parse(JSON.stringify({ filters: activeChart.filters, colors: activeChart.colors, page: activeChart.page, size: activeChart.size }));
    announce('Gráfico copiado. Use Ctrl+V para colar.');
  } else if (k === 'v' && chartClipboard) {
    e.preventDefault();
    pasteChart();
  }
}

function updateChartActionButtons() {
  const rm = document.getElementById('qfRemoveChart');
  if (!rm) return;
  rm.disabled = !activeChart;
  rm.title = rm.disabled ? 'Selecione um gráfico para excluir' : 'Excluir gráfico selecionado';
  const empty = board.querySelector('.board-empty');
  if (empty) empty.hidden = charts.length > 0;
  board.classList.toggle('is-multi', charts.length > 1);
  labelCharts();
}

// ── Layout: cards posicionados livremente dentro da área da página ──
const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), Math.max(lo, hi));
function clampSize(w, h) {
  const maxW = board.clientWidth - 2 * BOARD_M;
  return { w: clamp(w, Math.min(420, maxW), maxW), h: clamp(h, CHART_MIN_H, Math.max(CHART_MIN_H, innerHeight * 0.9)) };
}
function clampPos(c, x, y) {
  const boardTop = board.getBoundingClientRect().top;
  const visibleBottom = innerHeight - boardTop - BOARD_M;
  return {
    x: clamp(x, BOARD_M, board.clientWidth - BOARD_M - c.el.offsetWidth),
    y: clamp(y, Math.max(BOARD_M, -boardTop + BOARD_M), visibleBottom - c.el.offsetHeight)
  };
}
function applyChartLayout(c) {
  c.el.style.left = c.pos.x + 'px';
  c.el.style.top = c.pos.y + 'px';
  c.el.style.width = c.size.w + 'px';
  c.el.querySelector('.chart-container').style.height = c.size.h + 'px';
}
function updateBoardHeight() {
  const bottom = Math.max(0, ...charts.map(c => c.pos.y + c.el.offsetHeight));
  board.style.minHeight = Math.max(innerHeight - 64, bottom + 24) + 'px';
}
function defaultSize() {
  return clampSize(Math.min(board.clientWidth - 2 * BOARD_M, 1200), Math.min(innerHeight * 0.76, 720));
}

function drag(el, onMove, onEnd) {
  el.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    closeChartPalette();
    el.setPointerCapture(e.pointerId);
    const start = onMove(null, e);
    const move = ev => onMove(start, ev);
    const up = () => {
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
      onEnd();
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  });
}

// ── Grade e guias de alinhamento (só durante mover/redimensionar) ──
const SNAP = 8;
let guideV = null, guideH = null;
function showGuides(x, y) {
  if (!guideV) {
    guideV = document.createElement('div'); guideV.className = 'snap-guide v';
    guideH = document.createElement('div'); guideH.className = 'snap-guide h';
    board.append(guideV, guideH);
  }
  guideV.style.display = x == null ? 'none' : 'block';
  if (x != null) guideV.style.left = x + 'px';
  guideH.style.display = y == null ? 'none' : 'block';
  if (y != null) guideH.style.top = y + 'px';
}
// Geometria dos demais gráficos lida uma vez no início (arraste sem leituras extras de layout)
function startArrange(c) {
  board.classList.add('is-arranging');
  return charts.filter(o => o !== c).map(o => ({ l: o.pos.x, t: o.pos.y, w: o.el.offsetWidth, h: o.el.offsetHeight, ch: o.size.h }));
}
function endArrange() { board.classList.remove('is-arranging'); showGuides(null, null); }
// Menor ajuste (≤ SNAP) que alinha um dos pontos às linhas-alvo
function nearest(points, targets) {
  let best = null;
  points.forEach(p => targets.forEach(t => {
    const d = t - p;
    if (Math.abs(d) <= SNAP && (!best || Math.abs(d) < Math.abs(best.d))) best = { d, line: t };
  }));
  return best;
}

function attachMoveResize(c) {
  drag(c.el.querySelector('.chart-header'), (s, e) => {
    if (!s) {
      c.el.classList.add('is-dragging');
      return { dx: e.clientX - c.pos.x, dy: e.clientY - c.pos.y, w: c.el.offsetWidth, h: c.el.offsetHeight, others: startArrange(c) };
    }
    const pos = clampPos(c, e.clientX - s.dx, e.clientY - s.dy);
    const sx = nearest([pos.x, pos.x + s.w / 2, pos.x + s.w], s.others.flatMap(o => [o.l, o.l + o.w / 2, o.l + o.w]));
    const sy = nearest([pos.y, pos.y + s.h / 2, pos.y + s.h], s.others.flatMap(o => [o.t, o.t + o.h / 2, o.t + o.h]));
    if (sx) pos.x += sx.d;
    if (sy) pos.y += sy.d;
    c.pos = pos;
    applyChartLayout(c);
    showGuides(sx && sx.line, sy && sy.line);
  }, () => { c.el.classList.remove('is-dragging'); endArrange(); updateBoardHeight(); saveCharts(); });

  drag(c.el.querySelector('.chart-resize-handle'), (s, e) => {
    if (!s) {
      c.el.classList.add('is-resizing');
      return { x: e.clientX, y: e.clientY, w: c.size.w, h: c.size.h, extra: c.el.offsetHeight - c.size.h, others: startArrange(c) };
    }
    const size = clampSize(s.w + e.clientX - s.x, s.h + e.clientY - s.y);
    // Borda direita/inferior alinhada a outro gráfico, ou mesma largura/altura de outro
    const ex = nearest([c.pos.x + size.w], s.others.flatMap(o => [o.l, o.l + o.w]));
    const ew = nearest([size.w], s.others.map(o => o.w));
    const ey = nearest([c.pos.y + s.extra + size.h], s.others.flatMap(o => [o.t, o.t + o.h]));
    const eh = nearest([size.h], s.others.map(o => o.ch));
    const bx = ex && (!ew || Math.abs(ex.d) <= Math.abs(ew.d)) ? ex : ew;
    const by = ey && (!eh || Math.abs(ey.d) <= Math.abs(eh.d)) ? ey : eh;
    if (bx) size.w += bx.d;
    if (by) size.h += by.d;
    c.size = size;
    applyChartLayout(c);
    showGuides(bx ? c.pos.x + size.w : null, by ? c.pos.y + s.extra + size.h : null);
  }, () => {
    c.el.classList.remove('is-resizing');
    endArrange();
    updateBoardHeight();
    renderTurnoverChart(getFilteredChartRows());
    saveCharts();
  });
}

function mountChart(saved, el) {
  const c = {
    id: saved.id || ('c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)),
    el: el || chartTemplate.cloneNode(true),
    filters: saved.filters || { ...defaultFilters },
    colors: saved.colors || { bgChart: '#F6F6F6' },
    page: saved.page || 0,
    size: clampSize((saved.size || defaultSize()).w, (saved.size || defaultSize()).h),
    pos: saved.pos || { x: 0, y: 0 }
  };
  if (!el) board.appendChild(c.el);
  c.el.classList.add('is-board-item');
  c.el.tabIndex = 0;
  c.el.setAttribute('role', 'group');
  c.el.setAttribute('aria-roledescription', 'gráfico');
  charts.push(c);
  applyChartLayout(c);
  attachMoveResize(c);
  return c;
}

function addChart() {
  stashActive();
  // Novo gráfico herda as dimensões atuais do card selecionado
  const size = activeChart ? clampSize(activeChart.size.w, activeChart.size.h) : defaultSize();
  const bottom = Math.max(0, ...charts.map(c => c.pos.y + c.el.offsetHeight));
  const x = activeChart ? activeChart.pos.x : (board.clientWidth - size.w) / 2;
  const c = mountChart({ size, pos: { x, y: bottom + 24 } });
  updateBoardHeight();
  activateChart(c);
  renderActiveChart();
  saveCharts();
  c.el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function removeSelectedChart() {
  if (!activeChart) return;
  openDeleteModal();
}

function deleteActiveChart() {
  const c = activeChart;
  closeChartPalette();
  const label = c.el.getAttribute('aria-label').replace(', selecionado', '');
  const gap = c.el.offsetHeight + 24, top = c.pos.y, l = c.pos.x, r = c.pos.x + c.el.offsetWidth;
  c.el.remove();
  charts = charts.filter(x => x !== c);
  activeChart = null;
  // Sobe os gráficos abaixo (mesma faixa horizontal) para ocupar o espaço liberado
  charts.forEach(o => {
    if (o.pos.y > top && o.pos.x < r && o.pos.x + o.el.offsetWidth > l) {
      o.pos = { x: o.pos.x, y: Math.max(BOARD_M, o.pos.y - gap) };
      applyChartLayout(o);
    }
  });
  updateChartActionButtons();
  updateBoardHeight();
  saveCharts();
  announce(label + ' excluído.');
}

// ── Confirmação simples de exclusão (focus trap, Esc, retorno de foco) ──
let modalOrigin = null;
function buildDeleteModal() {
  const ov = document.createElement('div');
  ov.className = 'qf-modal-overlay';
  ov.innerHTML = `
    <div class="qf-modal" role="alertdialog" aria-modal="true" aria-labelledby="qfModalTitle">
      <div class="qf-modal-head">
        <div class="qf-modal-icon" aria-hidden="true"><span>✕</span></div>
        <h2 class="qf-modal-title" id="qfModalTitle">Excluir o gráfico selecionado?</h2>
      </div>
      <button type="button" class="qf-modal-close" data-modal-cancel aria-label="Fechar e cancelar exclusão">✕</button>
      <div class="qf-modal-actions">
        <button type="button" class="qf-modal-btn" data-modal-cancel>Cancelar</button>
        <button type="button" class="qf-modal-btn danger" data-modal-confirm>Confirmar</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', (e) => {
    if (e.target === ov || e.target.closest('[data-modal-cancel]')) closeDeleteModal();
    else if (e.target.closest('[data-modal-confirm]')) {
      closeDeleteModal();
      deleteActiveChart();
      document.getElementById('qfAddChart').focus();
    }
  });
  ov.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); closeDeleteModal(); return; }
    if (e.key !== 'Tab') return;
    const f = [...ov.querySelectorAll('button')];
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  return ov;
}
function openDeleteModal() {
  const ov = document.querySelector('.qf-modal-overlay') || buildDeleteModal();
  modalOrigin = document.activeElement;
  ov.classList.add('open');
  ov.querySelector('.qf-modal-actions [data-modal-cancel]').focus();
}
function closeDeleteModal() {
  const ov = document.querySelector('.qf-modal-overlay');
  if (!ov) return;
  ov.classList.remove('open');
  const back = modalOrigin && document.contains(modalOrigin) && !modalOrigin.disabled ? modalOrigin : document.getElementById('qfAddChart');
  back.focus();
}

function initCharts() {
  defaultFilters = serializeFilters();
  board.classList.add('charts-board');
  board.insertAdjacentHTML('beforeend', '<p class="board-empty" hidden>Nenhum gráfico na página. Use + para adicionar.</p>');
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(CHARTS_KEY) || 'null'); } catch (e) { saved = null; }
  const first = document.getElementById('chartWrapper');
  if (saved && Array.isArray(saved.charts) && saved.charts.length) {
    saved.charts.forEach((sc, i) => mountChart(sc, i === 0 ? first : null));
  } else {
    // Migração do tamanho/cores já salvos por 'vdt-chart-size'/'vdt-chart-colors'
    let size = null;
    try { size = JSON.parse(localStorage.getItem('vdt-chart-size') || 'null'); } catch (e) { size = null; }
    size = size && size.w && size.h ? clampSize(size.w, size.h) : defaultSize();
    mountChart({ filters: defaultFilters, colors: { ...COLORS }, size, pos: { x: (board.clientWidth - size.w) / 2, y: 16 } }, first);
  }
  charts.forEach(c => { c.el.classList.remove('is-selected'); setChartIds(c, false); });
  activeChart = null;
  renderAllCharts();
  activateChart(charts.find(c => c.id === (saved && saved.active)) || charts[0]);
  updateBoardHeight();
  saveCharts();

  // Seleciona o card antes de qualquer outra ação (clique, arraste, paleta)
  document.addEventListener('pointerdown', (e) => {
    const w = e.target.closest('.is-board-item');
    if (w) activateChart(charts.find(c => c.el === w));
    // Clique no fundo da página (fora de gráficos, filtros, paleta e modal) remove a seleção
    else if (!e.target.closest('.filters-bar-wrap, .qf-panel, #chartPalette, .qf-modal-overlay, .topnav')) deselectChart();
  }, true);
  // Teclado: Esc sobre um gráfico remove a seleção (se não houver paleta/modal aberto)
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || !e.target.closest || !e.target.closest('.is-board-item')) return;
    if (document.querySelector('#chartPalette.active, .qf-modal-overlay.open')) return;
    deselectChart();
  });
  document.addEventListener('focusin', (e) => {
    const w = e.target.closest && e.target.closest('.is-board-item');
    if (w) activateChart(charts.find(c => c.el === w));
  });
  document.addEventListener('keydown', onChartShortcut);
  const live = document.createElement('div');
  live.id = 'chartLive'; live.className = 'sr-only'; live.setAttribute('aria-live', 'polite');
  document.body.appendChild(live);
  document.getElementById('qfAddChart').addEventListener('click', (e) => { e.stopPropagation(); addChart(); });
  document.getElementById('qfRemoveChart').addEventListener('click', (e) => { e.stopPropagation(); removeSelectedChart(); });

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      charts.forEach(c => { c.size = clampSize(c.size.w, c.size.h); applyChartLayout(c); c.pos = { x: clampPos(c, c.pos.x, c.pos.y).x, y: c.pos.y }; applyChartLayout(c); });
      updateBoardHeight();
      renderAllCharts();
    }, 120);
  });
}
</script>
