<!DOCTYPE html>
<html lang="pt-BR">
<!--
  ═══════════════════════════════════════════════════════════════════
  QUARTELY · Dashboard — Página de Gráfico
  ═══════════════════════════════════════════════════════════════════
  PAPEL DA PÁGINA
    Tela de dados: mesma topbar do index.html, sem hero de imagem,
    com o gráfico de Turnover centralizado na página.

  TEMA CLARO/ESCURO
    Alternado por body[data-bg="dark"] (persistido em localStorage
    'vdt-theme'). Toda regra de cor precisa do par claro + escuro.

  INTERNACIONALIZAÇÃO (i18n)
    Marque o elemento com data-i18n / -title / -aria / -placeholder e
    cadastre a chave nos DOIS dicionários (pt-BR e en) no fim do arquivo.
    Idioma persistido em localStorage 'vdt-lang'.
  ═══════════════════════════════════════════════════════════════════
-->
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Quartely — Dashboard</title>
<style>
/* ═══════════════════════════════════════════════════
   TOPNAV LAYOUT
═══════════════════════════════════════════════════ */

:root {
  --vbm-blue: #3cb5e5;
  --vbm-blue-light: #7dd3f0;
  --vbm-blue-dark: #0d2640;
  --vbm-dark: #0a1421;
  --vbm-mid: #6b7c93;
  --vbm-white: #f4f7fb;
  --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

[data-bg="dark"] {
  --vbm-dark: #f4f7fb;
  --vbm-mid: rgba(244,247,251,.55);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  overflow-x: clip;
  overflow-y: auto;
}

body {
  background: #eef1f6;
  min-height: 100vh;
  color: var(--vbm-dark);
}

[data-bg="dark"] body,
body[data-bg="dark"] {
  background: linear-gradient(160deg, #10131a 0%, var(--vbm-blue-dark) 100%);
}

/* App layout */
.app-layout { display: block; }
.app-main { margin-left: 0; min-height: calc(100vh - 64px); }
.page-content {
  padding: 1.75rem;
  min-height: calc(100vh - 64px);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Topbar (sempre sólida — não há hero para "revelar" o fundo) */
.topnav {
  position: sticky;
  top: 0;
  z-index: 100;
  height: 64px;
  background: var(--vbm-blue-dark);
  display: flex;
  align-items: center;
  padding: 0 2rem;
  gap: 0;
  border-bottom: 1px solid rgba(255,255,255,.05);
  box-shadow: 0 2px 20px rgba(13,38,64,.18);
}

.topnav-logo {
  display: flex;
  align-items: center;
  text-decoration: none;
  flex-shrink: 0;
  margin-right: 1.5rem;
  position: relative;
  z-index: 1;
}

.topnav-logo img { height: 26px; width: auto; filter: brightness(10); }

.topnav-links {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .15rem;
  flex: 1;
  position: relative;
  z-index: 1;
}

.topnav-link {
  display: flex;
  align-items: center;
  gap: .4rem;
  padding: .5rem .85rem;
  border-radius: .45rem;
  font-family: 'Poppins', sans-serif;
  font-weight: 400;
  font-size: .72rem;
  letter-spacing: .04em;
  color: rgba(255,255,255,.75);
  text-decoration: none;
  white-space: nowrap;
  transition: color .18s;
  position: relative;
}

.topnav-link:hover { color: #fff; }

.topnav-link.active {
  color: #fff;
}

.topnav-link::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 50%;
  width: 0;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, #fff 25%, #fff 75%, transparent);
  border-radius: 10px;
  box-shadow: 0 0 8px rgba(255,255,255,.65);
  opacity: 0;
  transform: translateX(-50%);
  transition: width .3s var(--ease-out), opacity .3s var(--ease-out);
}

.topnav-link.active::after {
  width: 60%;
  opacity: 1;
}

.topnav-sep {
  width: 1px;
  height: 20px;
  background: rgba(255,255,255,.25);
  flex-shrink: 0;
  margin: 0 .1rem;
}

.topnav-actions {
  display: flex;
  align-items: center;
  gap: .5rem;
  flex-shrink: 0;
  margin-left: auto;
  position: relative;
  z-index: 1;
}

.settings-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  padding: 0;
  border: none;
  border-radius: 100px;
  background: transparent;
  color: #fff;
  cursor: pointer;
  flex-shrink: 0;
  transition: background .25s;
}

.settings-btn:hover { background: rgba(255,255,255,.12); }

.topnav-user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-left: 10px;
  border-left: 1px solid rgba(255,255,255,.22);
  flex-shrink: 0;
}

.topnav-user-text {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  line-height: 1.3;
}

.topnav-user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(145deg, var(--vbm-blue-light), var(--vbm-blue-dark));
  border: 1.5px solid rgba(255,255,255,.5);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Poppins', sans-serif;
  font-weight: 700;
  font-size: 11px;
  color: #fff;
  flex-shrink: 0;
}

.topnav-user-name {
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
  font-size: 11.5px;
  color: #fff;
  white-space: nowrap;
}

.topnav-user-role {
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: rgba(255,255,255,.6);
  white-space: nowrap;
}

@media (max-width: 960px) {
  .topnav-links { display: none; }
  .topnav-user-role { display: none; }
}

@media (max-width: 540px) {
  .topnav-user-name { display: none; }
}

@media (max-width: 768px) {
  .page-content { padding: 1rem; }
}

/* ═══════════════════════════════════════════════════
   CHART CARD (Turnover)
═══════════════════════════════════════════════════ */

.chart-card {
  width: 100%;
  max-width: 460px;
  background: #ffffff;
  border-radius: 14px;
  box-shadow: 0 12px 40px rgba(10,20,35,.18), 0 2px 8px rgba(10,20,35,.08);
  padding: 1.5rem 1.5rem 1.25rem;
}

.chart-card-title {
  font-family: 'Poppins', sans-serif;
  font-weight: 700;
  font-size: 1.05rem;
  color: #1a2942;
}

.chart-card-subtitle {
  font-family: 'Poppins', sans-serif;
  font-weight: 400;
  font-size: .78rem;
  color: #8b96a8;
  margin-top: 2px;
  margin-bottom: 1rem;
}

.chart-svg-wrap { width: 100%; }

/* Tema escuro */
[data-bg="dark"] .chart-card {
  background: #ffffff; /* mantém cartão claro, como no modelo, mesmo no tema escuro */
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,.14); border-radius: 100px; }
[data-bg="dark"] ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); }
</style>
</head>
<body>

<!-- ═══ TOP NAVIGATION ═══ -->
<nav class="topnav" id="topnav">
  <a href="index.html" class="topnav-logo">
    <img src="assets/images/vale-logo.svg" alt="Quartely"/>
  </a>

  <div class="topnav-links" id="topnavLinks">
    <a href="quartely.html" class="topnav-link active" data-i18n="nav.quartely">
      <i class="fa-solid fa-chart-line"></i> <span>Quartely</span>
    </a>

    <div class="topnav-sep"></div>

    <a href="#monthly" class="topnav-link" data-i18n="nav.monthly">
      <i class="fa-solid fa-calendar"></i> <span>Monthly</span>
    </a>
  </div>

  <div class="topnav-actions">
    <button class="settings-btn" id="settingsBtn" type="button" title="Configurações" aria-label="Configurações">
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none">
        <path d="M10 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" stroke="currentColor" stroke-width="1.5" />
        <path d="M16.2 12.3a1.4 1.4 0 0 0 .28 1.54l.05.05a1.7 1.7 0 1 1-2.4 2.4l-.05-.05a1.4 1.4 0 0 0-1.54-.28 1.4 1.4 0 0 0-.85 1.28V17.4a1.7 1.7 0 0 1-3.4 0v-.08a1.4 1.4 0 0 0-.91-1.28 1.4 1.4 0 0 0-1.54.28l-.05.05a1.7 1.7 0 1 1-2.4-2.4l.05-.05a1.4 1.4 0 0 0 .28-1.54 1.4 1.4 0 0 0-1.28-.85H2.6a1.7 1.7 0 0 1 0-3.4h.08a1.4 1.4 0 0 0 1.28-.91 1.4 1.4 0 0 0-.28-1.54l-.05-.05a1.7 1.7 0 1 1 2.4-2.4l.05.05a1.4 1.4 0 0 0 1.54.28h.06a1.4 1.4 0 0 0 .85-1.28V2.6a1.7 1.7 0 0 1 3.4 0v.08a1.4 1.4 0 0 0 .85 1.28h.06a1.4 1.4 0 0 0 1.54-.28l.05-.05a1.7 1.7 0 1 1 2.4 2.4l-.05.05a1.4 1.4 0 0 0-.28 1.54v.06a1.4 1.4 0 0 0 1.28.85h.08a1.7 1.7 0 0 1 0 3.4h-.08a1.4 1.4 0 0 0-1.28.85Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
      </svg>
    </button>
    <div class="topnav-user" id="topnavUser">
      <div class="topnav-user-text">
        <span class="topnav-user-name" id="topnavUserName">Usuário</span>
        <span class="topnav-user-role" id="topnavUserRole">Quartely</span>
      </div>
      <div class="topnav-user-avatar" id="topnavUserAvatar">QT</div>
    </div>
  </div>
</nav>

<!-- ═══ MAIN ═══ -->
<div class="app-layout">
<main class="app-main">
<div class="page-content">

  <!-- Chart Card -->
  <div class="chart-card" id="chartCard">
    <div class="chart-card-title" data-i18n="chart.title">Turnover</div>
    <div class="chart-card-subtitle">(%)</div>
    <div class="chart-svg-wrap">
      <svg id="turnoverChart" width="100%" viewBox="0 0 420 260"></svg>
    </div>
  </div>

</div>
</main>
</div>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<!-- D3.js -->
<script src="js/vendor/d3.min.js"></script>

<script>
// ─── Tema ───
document.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('vdt-theme') || 'light';
  document.body.setAttribute('data-bg', savedTheme === 'dark' ? 'dark' : 'light');

  document.getElementById('settingsBtn').addEventListener('click', () => {
    const currentBg = document.body.getAttribute('data-bg');
    const newBg = currentBg === 'dark' ? 'light' : 'dark';
    document.body.setAttribute('data-bg', newBg);
    localStorage.setItem('vdt-theme', newBg);
  });
});

// ─── Menu links ───
document.querySelectorAll('.topnav-link').forEach(link => {
  link.addEventListener('click', (e) => {
    if (link.getAttribute('href').startsWith('#')) {
      document.querySelectorAll('.topnav-link').forEach(l => l.classList.remove('active'));
      e.target.closest('.topnav-link').classList.add('active');
    }
  });
});

// ─── i18n ───
const i18n = {
  'pt-BR': {
    'nav.quartely': 'Quartely',
    'nav.monthly': 'Monthly',
    'chart.title': 'Turnover'
  },
  'en': {
    'nav.quartely': 'Quarterly',
    'nav.monthly': 'Monthly',
    'chart.title': 'Turnover'
  }
};

function applyI18n(lang) {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[lang] && i18n[lang][key]) {
      el.textContent = i18n[lang][key];
    }
  });
  localStorage.setItem('vdt-lang', lang);
}

const savedLang = localStorage.getItem('vdt-lang') || 'pt-BR';
applyI18n(savedLang);

// ═══════════════════════════════════════════════════
// TURNOVER CHART (D3.js)
// ═══════════════════════════════════════════════════
const turnoverData = [
  { label: 'Sep B', value: 0.60, kind: 'budget' },
  { label: 'Sep F', value: 0.60, kind: 'actual' },
  { label: 'Q3B',   value: 1.65, kind: 'budget' },
  { label: 'Q3F',   value: 1.33, kind: 'actual' },
  { label: '26B',   value: 7.39, kind: 'budget' },
  { label: '26A',   value: 6.25, kind: 'actual' }
];

function renderTurnoverChart() {
  const svg = d3.select('#turnoverChart');
  svg.selectAll('*').remove();

  const width = 420, height = 260;
  const margin = { top: 44, right: 10, bottom: 30, left: 10 };
  const innerWidth = width - margin.left - margin.right;
  const innerHeight = height - margin.top - margin.bottom;

  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  const x = d3.scaleBand()
    .domain(turnoverData.map(d => d.label))
    .range([0, innerWidth])
    .paddingInner(0.32)
    .paddingOuter(0.15);

  const yMax = d3.max(turnoverData, d => d.value) * 1.35;
  const y = d3.scaleLinear().domain([0, yMax]).range([innerHeight, 0]);

  const colorFor = d => d.kind === 'budget' ? '#c6ccd6' : '#3cb5e5';

  // Bars
  g.selectAll('rect.bar')
    .data(turnoverData)
    .enter()
    .append('rect')
    .attr('class', 'bar')
    .attr('x', d => x(d.label))
    .attr('y', d => y(d.value))
    .attr('width', x.bandwidth())
    .attr('height', d => innerHeight - y(d.value))
    .attr('rx', 3)
    .attr('fill', colorFor);

  // Value labels above bars
  g.selectAll('text.value')
    .data(turnoverData)
    .enter()
    .append('text')
    .attr('class', 'value')
    .attr('x', d => x(d.label) + x.bandwidth() / 2)
    .attr('y', d => y(d.value) - 8)
    .attr('text-anchor', 'middle')
    .attr('font-family', 'Poppins, sans-serif')
    .attr('font-weight', 600)
    .attr('font-size', '11px')
    .attr('fill', '#3a4658')
    .text(d => d.value.toFixed(2).replace('.', ','));

  // X axis labels
  g.selectAll('text.xlabel')
    .data(turnoverData)
    .enter()
    .append('text')
    .attr('class', 'xlabel')
    .attr('x', d => x(d.label) + x.bandwidth() / 2)
    .attr('y', innerHeight + 20)
    .attr('text-anchor', 'middle')
    .attr('font-family', 'Poppins, sans-serif')
    .attr('font-weight', 500)
    .attr('font-size', '10.5px')
    .attr('fill', '#6b7c93')
    .text(d => d.label);

  // Percentage change badges between pairs
  for (let i = 0; i < turnoverData.length; i += 2) {
    const a = turnoverData[i];
    const b = turnoverData[i + 1];
    const pct = a.value === 0 ? 0 : ((b.value - a.value) / a.value) * 100;
    const pctLabel = (pct >= 0 ? '' : '') + pct.toFixed(1).replace('.', ',').replace('-0,0', '0,0') + '%';

    const xa = x(a.label) + x.bandwidth() / 2;
    const xb = x(b.label) + x.bandwidth() / 2;
    const xMid = (xa + xb) / 2;
    const topY = Math.min(y(a.value), y(b.value)) - 26;

    // Dashed connector
    g.append('line')
      .attr('x1', xa).attr('x2', xb)
      .attr('y1', topY + 12).attr('y2', topY + 12)
      .attr('stroke', '#e0554f')
      .attr('stroke-width', 1)
      .attr('stroke-dasharray', '3,2');

    // Percentage label
    g.append('text')
      .attr('x', xMid)
      .attr('y', topY)
      .attr('text-anchor', 'middle')
      .attr('font-family', 'Poppins, sans-serif')
      .attr('font-weight', 600)
      .attr('font-size', '10.5px')
      .attr('fill', '#e0554f')
      .text(pctLabel);
  }
}

renderTurnoverChart();
window.addEventListener('resize', renderTurnoverChart);
</script>

</body>
</html>
