<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quarterly Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Topbar - Kaizen Style -->
  <header class="topbar">
    <!-- Left Section: Logo -->
    <div class="topbar-section topbar-left">
      <svg class="vale-logo" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
        <rect width="120" height="40" fill="#D4A547"/>
        <text x="60" y="28" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">VALE</text>
      </svg>
    </div>

    <!-- Center Section: Navigation -->
    <nav class="topbar-section topbar-center">
      <a href="#" class="nav-item" data-i18n="newKaizen">New Kaizen</a>
      <a href="#" class="nav-item" data-i18n="library">Library</a>
      <a href="#" class="nav-item approval-link">
        <span data-i18n="approval">Approval</span>
        <span class="badge">1</span>
      </a>
      <a href="#" class="nav-item" data-i18n="administration">Administration</a>
    </nav>

    <!-- Right Section: Actions & User -->
    <div class="topbar-section topbar-right">
      <!-- Settings Icon -->
      <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m5.08-5.08l4.24-4.24"/>
        </svg>
      </button>

      <!-- Theme Toggle -->
      <button class="icon-btn" id="theme-toggle" title="Toggle theme" aria-label="Toggle dark/light theme">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>

      <!-- User Info -->
      <div class="user-info">
        <div class="user-details">
          <div class="user-name" id="user-name">CRISTIAN ARLAN ALVES</div>
          <div class="user-role" id="user-role" data-i18n="userRole">ABL PROGRAMAÇÃO INTEGRADA</div>
        </div>
        <div class="user-avatar">CA</div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="chart-main">
    <!-- Filters Toolbar -->
    <div class="filters-toolbar">
      <div class="filters-container">
        <!-- Years Dropdown -->
        <div class="filter-dropdown-wrapper">
          <select id="years-filter" class="filter-dropdown" multiple>
            <option value="">Todos os anos</option>
          </select>
        </div>

        <!-- Sites Dropdown -->
        <div class="filter-dropdown-wrapper">
          <select id="sites-filter" class="filter-dropdown" multiple>
            <option value="">Todos os sites</option>
          </select>
        </div>

        <!-- Products Dropdown -->
        <div class="filter-dropdown-wrapper">
          <select id="products-filter" class="filter-dropdown" multiple>
            <option value="">Todos os produtos</option>
          </select>
        </div>

        <!-- Views Dropdown -->
        <div class="filter-dropdown-wrapper">
          <select id="views-filter" class="filter-dropdown" multiple>
            <option value="">Todas as visualizações</option>
          </select>
        </div>

        <!-- Horizons Dropdown -->
        <div class="filter-dropdown-wrapper">
          <select id="horizons-filter" class="filter-dropdown" multiple>
            <option value="">Todos os horizontes</option>
          </select>
        </div>
      </div>

      <div class="filters-actions">
        <!-- Clear Filters Button -->
        <button class="btn-clear-filters" id="clear-filters" data-i18n="clearFilters">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18"></path>
            <path d="M8 6v12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V6"></path>
            <line x1="9" y1="6" x2="9" y2="3h6v3"></line>
          </svg>
          Limpar Filtros
        </button>

        <!-- Export Excel Button (optional) -->
        <button class="btn-export" id="export-btn" title="Export to Excel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Export Excel
        </button>
      </div>
    </div>

    <!-- Chart Container -->
    <main class="chart-container">
      <!-- State Indicators -->
      <div class="chart-state" id="chart-state">
        <!-- Loading State -->
        <div class="state-loading" id="state-loading">
          <div class="spinner"></div>
          <p data-i18n="loading">Carregando dados...</p>
        </div>

        <!-- Empty State -->
        <div class="state-empty" id="state-empty" style="display: none;">
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <path d="M3 3h18v18H3z"></path>
            <path d="M3 12l6-6 6 6 6-6"></path>
            <path d="M21 15h-2v6h-2v-4h-2v4h-2v-6"></path>
          </svg>
          <h3 data-i18n="noData">Nenhum dado disponível</h3>
          <p data-i18n="noDataMessage">Tente ajustar os filtros</p>
        </div>

        <!-- Error State -->
        <div class="state-error" id="state-error" style="display: none;">
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <h3 data-i18n="error">Erro ao carregar dados</h3>
          <p id="error-message"></p>
          <button class="btn-retry" id="retry-btn" data-i18n="retry">Tentar Novamente</button>
        </div>
      </div>

      <!-- SVG Chart Container (hidden initially, shown when data loads) -->
      <div id="chart-wrapper" style="display: none; width: 100%; height: 100%;">
        <svg id="chart" style="width: 100%; height: 100%;"></svg>
      </div>
    </main>
  </div>

  <!-- D3 Library -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <!-- Internationalization -->
  <script>
    const i18n = {
      'pt-BR': {
        newKaizen: 'New Kaizen',
        library: 'Library',
        approval: 'Approval',
        administration: 'Administration',
        userRole: 'ABL PROGRAMAÇÃO INTEGRADA MS',
        filters: 'Filtros',
        years: 'Anos',
        sites: 'Sites',
        products: 'Produtos',
        views: 'Visualizações',
        horizons: 'Horizontes',
        clearFilters: 'Limpar Filtros',
        loading: 'Carregando dados...',
        noData: 'Nenhum dado disponível',
        noDataMessage: 'Tente ajustar os filtros',
        error: 'Erro ao carregar dados',
        retry: 'Tentar Novamente'
      },
      'en': {
        newKaizen: 'New Kaizen',
        library: 'Library',
        approval: 'Approval',
        administration: 'Administration',
        userRole: 'ABL PROGRAMMING INTEGRATED MS',
        filters: 'Filters',
        years: 'Years',
        sites: 'Sites',
        products: 'Products',
        views: 'Views',
        horizons: 'Horizons',
        clearFilters: 'Clear Filters',
        loading: 'Loading data...',
        noData: 'No data available',
        noDataMessage: 'Try adjusting the filters',
        error: 'Error loading data',
        retry: 'Retry'
      }
    };

    function setLanguage(lang) {
      localStorage.setItem('language', lang);
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = i18n[lang][key];
      });
    }

    const savedLang = localStorage.getItem('language') || 'pt-BR';
    setLanguage(savedLang);
    document.getElementById('language-select').value = savedLang;
  </script>

  <!-- Application Script -->
  <script src="chart.js"></script>
</body>
</html>
