# Databricks App — Quartely (app independente)
# Conexão DIRETA ao Azure SQL de PRODUÇÃO (BDIBPBMSA_PRD), com pool próprio
# no server.js (pacote mssql). Não depende do app VBM Kaizen.
command:
  - npm
  - start

env:
  # ── Banco: Azure SQL PRD (configuração não sensível) ──
  - name: 'AZURE_SQL_SERVER'
    value: 'rdb-ibp-bmsa-prd.database.windows.net'
  - name: 'AZURE_SQL_DATABASE'
    value: 'BDIBPBMSA_PRD'
  - name: 'AZURE_SQL_PORT'
    value: '1433'

  # ── Credenciais: SEMPRE via secret do Databricks App, nunca em texto puro ──
  # Antes do PRIMEIRO deploy, em Compute > Apps > (este app) > Edit >
  # App resources > + Add resource > Secret, crie e CONFIRME que existem:
  #   resource key 'azure-sql-user'      → usuário com SELECT em IBP.*
  #   resource key 'azure-sql-password'  → senha desse usuário
  # Sem eles o app sobe, mas /api/chart-data responde 503/500 e a página
  # mostra o aviso de "dados de exemplo".
  - name: 'AZURE_SQL_USER'
    valueFrom: 'azure-sql-user'
  - name: 'AZURE_SQL_PASSWORD'
    valueFrom: 'azure-sql-password'
