# Databricks App — VBM Kaizen (front-end + API Aprovadores)
# Conexão DIRETA ao Azure SQL Database (sem passar pelo Databricks SQL
# Warehouse), no mesmo modelo do protótipo de teste (app.py / pymssql):
# credenciais fixas via env vars, lidas pelo server.js com `mssql`.
command:
  - npm
  - start

env:
  # Configs não sensíveis: pode deixar hardcoded aqui

  - name: 'DATABRICKS_HOST'
    value: 'https://adb-7405608945147182.2.azuredatabricks.net'
  - name: 'AZURE_SQL_SERVER'
    value: 'rdb-ibp-bmsa-prd.database.windows.net'
  - name: 'AZURE_SQL_DATABASE'
    value: 'BDIBPBMSA_PRD'
  - name: 'AZURE_SQL_PORT'
    value: '1433'
  - name: 'AZURE_SQL_SCHEMA'
    value: 'ci'
  - name: 'AZURE_SQL_TABLE'
    value: 'kzn_aprovador'

  # Usuário e senha: NUNCA em texto puro em produção.
  # Devem vir de um Secret Scope do Databricks, adicionado como
  # "resource" do app (App resources > + Add resource > Secret) e
  # referenciado aqui via "valueFrom" (nome do resource, não o valor
  # do secret). Exemplo, assumindo um resource chamado "azure-sql":
  #
  #   - name: 'AZURE_SQL_USER'
  #     valueFrom: 'azure-sql-user'
  #   - name: 'AZURE_SQL_PASSWORD'
  #     valueFrom: 'azure-sql-password'
  #
  # Os valores abaixo replicam exatamente o app.yaml de teste fornecido
  # (texto puro) só para manter o mesmo comportamento por enquanto —
  # troque pelo valueFrom acima antes de ir para produção.
  - name: 'AZURE_SQL_USER'
    value: 'KZNDEV'
  - name: 'AZURE_SQL_PASSWORD'
    value: 'DEVKZN@!13'

  # ── Leitura das imagens ANTIGAS (Volumes do Databricks) ──
  # As fotos passaram a ser gravadas no Azure Blob (bloco abaixo). O
  # Volume continua sendo lido, e SÓ lido, para as fotos dos Kaizens
  # cadastrados antes da troca: o caminho delas já está gravado em
  # URL_IMG_ANTES/URL_IMG_DEPOIS e não foi migrado.
  #
  # NADA a configurar aqui: DATABRICKS_HOST, DATABRICKS_CLIENT_ID e
  # DATABRICKS_CLIENT_SECRET são injetados automaticamente pelo runtime
  # do Databricks Apps (credenciais do service principal do PRÓPRIO
  # app) — ver databricks-fs.js para como são usadas.
  #
  # A permissão no volume agora precisa ser só de LEITURA (READ VOLUME)
  # em franquia_bmsa_insight.ci.kaizen. Se um dia os arquivos antigos
  # forem copiados para o Blob e as duas colunas atualizadas, o volume
  # deixa de ser necessário.

  # ── Upload de imagens (Novo Kaizen) para o Azure Blob Storage ──
  # AZURE_STORAGE_ACCOUNT    URL da conta JÁ COM O CONTAINER.
  # AZURE_STORAGE_CONTAINER  apesar do nome, é a PASTA dentro do
  #                          container: nome de container no Azure não
  #                          aceita espaço nem maiúscula, e este tem os
  #                          dois. As fotos ficam nas pastas que o time
  #                          JÁ usa no datalake:
  #                            05 - Kaizen/01 - Imagens/01 - Antes
  #                            05 - Kaizen/01 - Imagens/02 - Depois
  # AZURE_STORAGE_SAS_TOKEN  SAS do container. Ver azure-blob.js.
  #
  # DUAS PENDÊNCIAS neste SAS, as duas do lado do Azure:
  #
  #   1. sp=racw NÃO tem 'd' (delete). É essa falta que deixa um arquivo
  #      TEMP_ ao lado de cada foto salva num CADASTRO NOVO: o app copia
  #      o provisório para "<ID_KAIZEN>.<ext>" e a remoção do provisório
  #      volta 403. O cadastro funciona, o aviso fica no log, e o lixo se
  #      acumula. Reemita com sp=racwd.
  #
  #   2. O valor abaixo está em TEXTO PURO e dá escrita no container
  #      inteiro até 2030. O DOWNLOAD deste arquivo já foi fechado — o
  #      server.js agora recusa servir app.yaml, server.js, node_modules
  #      e companhia (ver ARQUIVOS_DO_SERVIDOR) —, mas o token esteve
  #      exposto enquanto isso não existia e continua em texto puro num
  #      arquivo versionado. Revogue este SAS, emita outro com sp=racwd
  #      e traga por Secret Scope:
  #
  #        - name: 'AZURE_STORAGE_SAS_TOKEN'
  #          valueFrom: 'azure-storage-sas'

  - name: 'AZURE_STORAGE_ACCOUNT'
    value: 'https://ibpdatalake.blob.core.windows.net/vbmdatalake'
  - name: 'AZURE_STORAGE_CONTAINER'
    value: '05 - Kaizen'
  - name: 'AZURE_STORAGE_SAS_TOKEN'
    value: 'sp=racw&st=2026-09-02T13:37:52Z&se=2030-01-18T21:52:52Z&spr=https&sv=2026-02-06&sr=c&sig=8gEPo1jtLiz1wbdSW7EVlOl0su8Tj5%2FqJDYe7I%2B%2BOHI%3D'


  # ── Avisos por e-mail das decisões de aprovação ──
  # NADA de credencial aqui. O e-mail é enviado pelo NAVEGADOR, com o
  # token delegado do próprio aprovador (Microsoft Graph), e sai pela
  # caixa compartilhada PCI.Base.Metals@Vale.com. Não há client secret
  # em nenhum ponto do projeto.
  #
  # O que precisa ser preenchido fica em js/msal-config.js (clientId e
  # authority do app registration). No mesmo app registration:
  #   • Redirect URI do tipo SPA para index.html e aprovacao.html
  #   • Permissões DELEGADAS do Microsoft Graph:
  #       User.Read
  #       Mail.Send.Shared
  #   • A conta de quem aprova precisa de "Enviar Como" (ou "Enviar em
  #     Nome De") na caixa PCI.Base.Metals@Vale.com.
  #
  # Opcionais — só declare para mudar o padrão do email-kaizen.js:
  #   KAIZEN_EMAIL_REMETENTE  padrão 'PCI.Base.Metals@Vale.com'
  #   KAIZEN_APP_URL          padrão o endereço deste app (usado nos
  #                           links de aprovacao.html e biblioteca.html)
  #
  #   KAIZEN_EMAIL_DO_USUARIO  'true' faz o comunicado sair pela caixa
  #                            de QUEM ESTÁ USANDO o sistema, em vez da
  #                            compartilhada. Serve para destravar o
  #                            envio enquanto o "Enviar Como" em
  #                            PCI.Base.Metals@Vale.com não é liberado
  #                            pelo time de Exchange: cada um envia pela
  #                            própria caixa, então não há permissão a
  #                            pedir. Mesma permissão delegada dos dois
  #                            jeitos (Mail.Send.Shared cobre os dois).
  #                            Para voltar ao normal, remova a variável.
  #
  #   - name: 'KAIZEN_EMAIL_DO_USUARIO'
  #     value: 'true'

  # ══ ENVIO DE E-MAIL PELO SERVIDOR — ESCOLHA UM DOS DOIS BLOCOS ══
  #
  # O servidor tenta, nesta ordem: GRAPH_* (service principal), depois
  # SMTP_*. Não achando nenhum, os comunicados voltam montados para a
  # TELA, que tenta entregar pelo Graph com o token de quem está logado —
  # o comportamento antigo, e o que faz o e-mail simplesmente não sair
  # quando falta "Enviar Como" ou consentimento.
  #
  # A linha "[email] canal de envio: ..." no início do log do app diz
  # qual caminho está valendo. Se ela disser "nenhum", nenhuma variável
  # abaixo foi lida.

  # ── OPÇÃO 1 (recomendada): Microsoft Graph com SERVICE PRINCIPAL ──
  # O app envia com a PRÓPRIA identidade: não depende de usuário logado,
  # de navegador aberto nem de SMTP AUTH (que a Microsoft aposentou no
  # Exchange Online). É o que faz o comunicado sair no cadastro de um
  # Kaizen mesmo com ninguém na tela.
  #
  # GRAPH_TENANT_ID      diretório (tenant) do Entra
  # GRAPH_CLIENT_ID      Application (client) ID do service principal
  # GRAPH_CLIENT_SECRET  segredo do service principal — SEMPRE valueFrom
  # GRAPH_REMETENTE      caixa de onde o e-mail sai
  #
  # ANTES DE FUNCIONAR, duas liberações no Entra/Exchange (não dá para
  # fazer por código, e sem elas o envio volta "sem permissão"):
  #   1. Permissão de APLICAÇÃO (não delegada) Mail.Send do Microsoft
  #      Graph no app registration, COM consentimento do administrador.
  #   2. Uma ApplicationAccessPolicy no Exchange restringindo este
  #      service principal à caixa do programa. Mail.Send de aplicação
  #      vale para TODAS as caixas do locatário por padrão — peça a
  #      política junto, é o que costuma destravar a aprovação da
  #      segurança da informação.
  #
  #   - name: 'GRAPH_TENANT_ID'
  #     value: '7893571b-6c2c-4cef-b4da-7d4b266a0626'
  #   - name: 'GRAPH_CLIENT_ID'
  #     value: '<Application (client) ID do service principal>'
  #   - name: 'GRAPH_CLIENT_SECRET'
  #     valueFrom: 'graph-client-secret'
  #   - name: 'GRAPH_REMETENTE'
  #     value: 'PCI.Base.Metals@Vale.com'
  #
  # O segredo já está num Azure Key Vault? Então NÃO copie o valor para
  # cá. O Azure Databricks cria Secret Scope APOIADO EM KEY VAULT: o
  # scope aponta para o cofre e o valor continua lá, com a rotação e a
  # auditoria do cofre. Depois é só referenciar o scope no valueFrom.

  # ── OPÇÃO 2: SMTP (aba "E-mail" do admin.html e comunicados) ──
  # Só vale se o bloco GRAPH_* acima NÃO estiver preenchido. Serve para
  # instalação com relay SMTP próprio (um host interno da empresa). Com
  # Exchange Online, confirme antes com o time de Exchange se a submissão
  # autenticada por senha ainda é aceita — a Microsoft aposentou a
  # autenticação básica nesse canal, e nesse caso a OPÇÃO 1 é o caminho.
  #
  # SMTP_HOST       ex.: smtp.office365.com
  # SMTP_PORT       587 (STARTTLS, padrão) ou 465 (TLS direto)
  # SMTP_USER       conta de serviço que autentica
  # SMTP_PASSWORD   senha/app password dessa conta
  # SMTP_FROM       endereço do "De:". Padrão: o mesmo do SMTP_USER.
  #                 Um "De:" diferente da conta autenticada exige
  #                 "Enviar Como" no Exchange — sem isso o próprio
  #                 servidor de e-mail recusa.
  # SMTP_FROM_NOME  nome exibido. Padrão: 'Programa Kaizen'.
  #
  # A SENHA TEM DE VIR DE SECRET SCOPE, não de texto puro aqui. É o
  # requisito central desta funcionalidade: a credencial não pode ser
  # vista por ninguém, nem pelo navegador. O servidor já recusa servir
  # este arquivo (ver ARQUIVOS_DO_SERVIDOR em server.js), mas segredo em
  # texto puro num arquivo versionado continua sendo segredo vazado.
  #
  #   - name: 'SMTP_HOST'
  #     value: 'smtp.office365.com'
  #   - name: 'SMTP_PORT'
  #     value: '587'
  #   - name: 'SMTP_USER'
  #     valueFrom: 'smtp-user'
  #   - name: 'SMTP_PASSWORD'
  #     valueFrom: 'smtp-password'
  #   - name: 'SMTP_FROM'
  #     value: 'PCI.Base.Metals@Vale.com'
  #
  # Enquanto as quatro não existirem, a aba "E-mail" aparece com o aviso
  # "não está configurado" e a rota devolve 503 — nada quebra.
  #
  # ANTES DE USAR: rode database/criar_kzn_email_log.sql uma vez. É a
  # tabela de auditoria (quem enviou, quando, para quem, com que
  # assunto, com que resultado). Sem ela o e-mail sai do mesmo jeito,
  # mas a auditoria fica só no log do app.
